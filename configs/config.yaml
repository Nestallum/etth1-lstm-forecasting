# ETTh1 LSTM Forecasting — main configuration

data:
  csv_path: data/raw/ETTh1.csv
  lookback: 192
  horizon: 96
  target_index: 0
  num_workers: 0

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0
  early_stopping_patience: 6
  grad_clip: 1.0

model:
  input_size: 1
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  revin: true
  
paths:
  checkpoints_dir: checkpoints
  logs_dir: logs
  results_dir: results

seed: 42

device: auto  # auto | cpu | cuda